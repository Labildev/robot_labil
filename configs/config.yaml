app:
  name: "robot_labil"
  log_level: "info"
  max_concurrency: 1

paths:
  database: "storage/robot.db"
  input_docs: "storage/input_docs"
  output_docs: "storage/output_docs"
  affiliate_assets: "storage/affiliate_assets"
  output_videos: "storage/output_videos"
  error_logs: "storage/error_logs"
  prompts_dir: "prompts"

ollama:
  bin_path: "tools/ollama/ollama.exe"
  models_dir: "storage/models"
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:3b"
  num_ctx: 4096
  keep_alive: "2m"
  request_timeout_sec: 180

document:
  chunk_word_limit: 2000
  map_reduce_threshold_words: 3000
  pdftotext_bin: "pdftotext"

video:
  filmcraft_bin: "filmcraft"
  filmcraft_mode: "cli"
  filmcraft_server_url: "http://127.0.0.1:4123"
  ffmpeg_bin: "ffmpeg"
  width: 1080
  height: 1920
  fps: 30
  fallback_to_ffmpeg: true

tts:
  enabled: true
  piper_bin: "tools/piper/piper.exe"
  model_path: "storage/models/piper/id_ID-news_tts-medium.onnx"

watcher:
  enabled: true
  poll_interval_sec: 5

web:
  listen_addr: "127.0.0.1:8080"
